<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>4학년 진로·직업 체험의 날 · 체험 고르기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#EDF1F7; --paper:#FFFFFF; --ink:#16233D; --muted:#5C6B86; --line:#DDE4EE;
    --r1:#FF4D6D; --r2:#FFA41B; --r3:#19B3A6; --hot:#2F6BFF;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px 130px}
  header.top{padding:26px 0 10px}
  .kicker{font-size:14px;color:var(--muted);font-weight:600}
  h1{margin:6px 0 8px;font-size:clamp(24px,5vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .lead{margin:0;color:var(--muted);font-size:15px;line-height:1.6;max-width:62ch}

  .tabs{display:flex;gap:6px;margin:16px 0 0}
  .tab{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
  .tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  .idbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px;align-items:center}
  .idbar label{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;font-weight:700}
  .idbar select{border:0;outline:0;font:inherit;font-weight:800;background:transparent;color:var(--ink)}
  .idmsg{font-size:14px;font-weight:700;color:var(--hot)}

  .tickets{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
  .ticketrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ticket{background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;min-height:64px;
    display:flex;flex-direction:column;justify-content:center;position:relative}
  .ticket .rank{font-size:12px;font-weight:800;color:var(--muted)}
  .ticket .who{font-size:15px;font-weight:800;margin-top:2px;line-height:1.25;word-break:keep-all;padding-right:18px}
  .ticket.filled{border-style:solid}
  .ticket.r1.filled{border-color:var(--r1)} .ticket.r1 .rank{color:var(--r1)}
  .ticket.r2.filled{border-color:var(--r2)} .ticket.r2 .rank{color:var(--r2)}
  .ticket.r3.filled{border-color:var(--r3)} .ticket.r3 .rank{color:var(--r3)}
  .ticket .x{position:absolute;top:6px;right:8px;border:0;background:transparent;font-size:16px;color:var(--muted);cursor:pointer}
  .empty{color:#9AA7BC;font-weight:700;font-size:14px;margin-top:2px}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border:1px solid var(--line);background:var(--paper);color:var(--muted);
    border-radius:999px;padding:9px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:14px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;position:relative}
  .card.picked{border-width:2px;padding:13px}
  .card.picked.p1{border-color:var(--r1)} .card.picked.p2{border-color:var(--r2)} .card.picked.p3{border-color:var(--r3)}
  .cat{font-size:12px;color:var(--muted);font-weight:700}
  .hot{color:var(--hot)}
  .name{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.3;word-break:keep-all}
  .hook{font-size:14px;color:var(--muted);line-height:1.55;margin:0;word-break:keep-all}
  .shot{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:#F0F3F8}
  .noshot{font-size:13px;color:var(--muted);background:#F6F8FC;border-radius:10px;padding:14px;text-align:center}
  .detail{font-size:14.5px;line-height:1.7;color:#3C4A63;background:#F6F8FC;border-radius:10px;padding:12px;margin:0;word-break:keep-all}
  .actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{border-radius:11px;padding:13px 8px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;border:1px solid var(--line);background:#F6F8FC;color:var(--ink)}
  .btn.pick{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.pick.on{background:#fff}
  .btn.pick.on.p1{color:var(--r1);border-color:var(--r1)} .btn.pick.on.p2{color:var(--r2);border-color:var(--r2)} .btn.pick.on.p3{color:var(--r3);border-color:var(--r3)}
  .btn:disabled{background:#EDF1F7;color:#9AA7BC;border-color:var(--line);cursor:not-allowed}
  .badge{position:absolute;top:-9px;right:12px;color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:3px 10px}
  .badge.p1{background:var(--r1)} .badge.p2{background:var(--r2)} .badge.p3{background:var(--r3)}

  .submitbar{position:fixed;left:0;right:0;bottom:0;background:rgba(237,241,247,.96);border-top:1px solid var(--line);padding:10px 16px;z-index:40}
  .submitinner{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .status{flex:1;font-size:14px;font-weight:700;color:var(--muted)}
  button.send{border:0;background:var(--r1);color:#fff;border-radius:12px;padding:13px 22px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
  button.send:disabled{background:#C8D0DC;cursor:not-allowed}

  table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:#F6F8FC;font-size:13px;color:var(--muted)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.top9 td{background:#EEF3FF}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .toolbar button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .note{font-size:13.5px;color:var(--muted);line-height:1.6}
  .hide{display:none}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:800;font-size:15px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker">2026학년도 망월초등학교 4학년</div>
    <h1>진로·직업 체험의 날<br>해보고 싶은 체험 고르기</h1>
    <p class="lead">31개 체험 중에서 <b>가장 해보고 싶은 순서대로 3가지</b>를 골라 주세요. 고른 순서대로 1지망·2지망·3지망이 됩니다. 제출한 뒤에도 같은 반·번호로 들어오면 언제든 고칠 수 있어요.</p>
  </header>

  <div class="tabs">
    <button class="tab" id="tabPick" aria-pressed="true">체험 고르기</button>
    <button class="tab" id="tabResult" aria-pressed="false">선생님용 결과</button>
  </div>

  <section id="viewPick">
    <div class="idbar">
      <label>반 <select id="klass"><option value="">선택</option></select></label>
      <label>번호 <select id="numno"><option value="">선택</option></select></label>
      <span class="idmsg" id="idmsg"></span>
    </div>

    <div class="tickets"><div class="ticketrow" id="ticketRow"></div></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="viewResult" class="hide">
    <div class="toolbar">
      <button id="btnLoad">결과 불러오기</button>
      <button id="btnSheet">구글 시트 열기</button>
      <button class="tab" id="sortScore" aria-pressed="true">점수순</button>
      <button class="tab" id="sortAll" aria-pressed="false">총 선택순</button>
      <button class="tab" id="sortFirst" aria-pressed="false">1지망순</button>
    </div>
    <p class="note" id="resultNote">점수는 1지망 3점, 2지망 2점, 3지망 1점입니다. 위쪽 9줄을 파란색으로 표시합니다. 제출된 원본 데이터는 구글 시트에 그대로 쌓입니다.</p>
    <div id="resultBox"></div>
  </section>
</div>

<div class="submitbar" id="submitbar">
  <div class="submitinner">
    <div class="status" id="status">반과 번호를 고르고, 체험 3가지를 골라 주세요</div>
    <button class="send" id="send" disabled>제출하기</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   ① 아래 SHEET_API 에 구글 앱스스크립트 웹앱 주소(.../exec)를 붙여넣으세요.
   ② SHEET_URL 은 구글 시트 주소(선생님용 '구글 시트 열기' 버튼).
   ③ TEACHER_CODE 는 결과 탭 비밀번호입니다.
   =================================================================== */
const SHEET_API   = "https://script.google.com/macros/s/AKfycbxm0GEvho7eaVskihkofvonAmHpxi2Q_BKaXUliM8hP5G9QrsmYd5mEXJi-NeKaWQJRRw/exec";
const SHEET_URL   = "https://docs.google.com/spreadsheets/d/1iciO7X2vAs_QikjcP0i2o9P0JinDn6vI4NZTa3iKdWw/edit";
const TEACHER_CODE = "202604";
const CLASSES = 9;      // 4학년 학급 수

/* 목록에서 빼고 싶은 프로그램이 있으면 따옴표로 이름을 추가하세요 */
const 빼는프로그램 = ["디지털아티스트"];
PROGRAMS.splice(0, PROGRAMS.length, ...PROGRAMS.filter(p => !빼는프로그램.includes(p.n)));

const CATS = ["전체","선호도 높음","4차산업·AI","문화·예술","엔터테인먼트","요리","미용","방송","기후·항공","수사·안전"];
let picks=[], filter="전체", open=new Set(), unlocked=false, already=false;

const $=id=>document.getElementById(id);
const klass=$("klass"), numno=$("numno");
for(let i=1;i<=CLASSES;i++) klass.add(new Option(`4학년 ${i}반`,i));
for(let i=1;i<=MAXNO;i++) numno.add(new Option(`${i}번`,i));

const chipsEl=$("chips");
CATS.forEach(c=>{
  const b=document.createElement("button");
  b.className="chip"; b.textContent=c; b.setAttribute("aria-pressed",c===filter);
  b.onclick=()=>{filter=c;[...chipsEl.children].forEach(x=>x.setAttribute("aria-pressed",x.textContent===c));renderGrid();};
  chipsEl.append(b);
});

function renderTickets(){
  const row=$("ticketRow"); row.innerHTML="";
  for(let i=0;i<3;i++){
    const d=document.createElement("div");
    d.className=`ticket r${i+1}`+(picks[i]?" filled":"");
    d.innerHTML=`<div class="rank">${i+1}지망</div>`+
      (picks[i]?`<div class="who">${picks[i]}</div><button class="x" aria-label="빼기">✕</button>`
               :`<div class="empty">아직 안 골랐어요</div>`);
    if(picks[i]) d.querySelector(".x").onclick=()=>{picks.splice(i,1);renderAll();};
    row.append(d);
  }
}

function renderGrid(){
  const g=$("grid"); g.innerHTML="";
  PROGRAMS.filter(p=> filter==="전체" || (filter==="선호도 높음"?p.hot:p.c===filter)).forEach(p=>{
    const idx=picks.indexOf(p.n), rank=idx+1, full=open.has(p.n);
    const card=document.createElement("div");
    card.className="card"+(rank?` picked p${rank}`:"");
    card.innerHTML=`
      ${rank?`<span class="badge p${rank}">${rank}지망</span>`:""}
      <div class="cat${p.hot?" hot":""}">${p.c}${p.hot?" · 인기":""}</div>
      <div class="name">${p.n}</div>
      <p class="hook">${p.h}</p>
      ${full?(PHOTOS[p.n]?`<img class="shot" src="${PHOTOS[p.n]}" alt="${p.n} 체험 활동 사진">`
                        :`<div class="noshot">사진 준비 중</div>`)+`<p class="detail">${p.d}</p>`:""}
      <div class="actions">
        <button class="btn more">${full?"설명 접기":"활동 설명 보기"}</button>
        <button class="btn pick${rank?` on p${rank}`:""}" ${(!rank&&picks.length>=3)?"disabled":""}>
          ${rank?`${rank}지망 · 빼기`:(picks.length>=3?"3개 다 골랐어요":"고르기")}
        </button>
      </div>`;
    card.querySelector(".more").onclick=()=>{full?open.delete(p.n):open.add(p.n);renderGrid();};
    card.querySelector(".pick").onclick=()=>{
      if(rank) picks.splice(idx,1); else if(picks.length<3) picks.push(p.n);
      renderAll();
    };
    g.append(card);
  });
}

function renderStatus(){
  const ok=picks.length===3&&klass.value&&numno.value;
  $("send").disabled=!ok;
  $("send").textContent=already?"고쳐서 다시 제출하기":"제출하기";
  $("status").textContent=
    !klass.value||!numno.value ? "먼저 반과 번호를 골라 주세요" :
    picks.length<3 ? `${3-picks.length}가지 더 고르면 돼요` :
    "다 골랐어요. 제출하기를 눌러 주세요";
}
function renderAll(){renderTickets();renderGrid();renderStatus();}

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400);}
const api=q=>SHEET_API+(SHEET_API.includes("?")?"&":"?")+q;

/* 반·번호를 고르면 이미 낸 답이 있는지 확인해서 불러온다 */
async function loadMine(){
  already=false; $("idmsg").textContent="";
  if(!klass.value||!numno.value){renderAll();return;}
  try{
    const r=await fetch(api(`action=get&klass=${klass.value}&no=${numno.value}`));
    const j=await r.json();
    if(j.found){
      picks=j.picks.filter(Boolean); already=true;
      $("idmsg").textContent="전에 낸 답을 불러왔어요. 고치고 다시 제출하면 바뀝니다.";
    }else{ picks=[]; }
  }catch(e){ $("idmsg").textContent="서버에 연결하지 못했어요. 선생님께 알려 주세요."; }
  renderAll();
}
klass.onchange=loadMine; numno.onchange=loadMine;

$("send").onclick=async()=>{
  const btn=$("send"); btn.disabled=true; btn.textContent="보내는 중…";
  try{
    const r=await fetch(SHEET_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"save",klass:Number(klass.value),no:Number(numno.value),picks})});
    const j=await r.json();
    if(!j.ok) throw new Error();
    already=true;
    $("idmsg").textContent="제출했어요. 마음이 바뀌면 다시 고쳐서 내도 돼요.";
    toast("제출했어요! 고마워요 🎟️");
  }catch(e){ toast("제출이 안 됐어요. 다시 눌러 주세요."); }
  renderStatus();
};

/* ---------- 선생님용 ---------- */
const tabPick=$("tabPick"), tabResult=$("tabResult");
function showTab(p){
  tabPick.setAttribute("aria-pressed",p); tabResult.setAttribute("aria-pressed",!p);
  $("viewPick").classList.toggle("hide",!p); $("viewResult").classList.toggle("hide",p);
  $("submitbar").classList.toggle("hide",!p);
}
tabPick.onclick=()=>showTab(true);
tabResult.onclick=()=>{
  if(!unlocked){
    const c=prompt("선생님용 코드를 입력하세요");
    if(c!==TEACHER_CODE){ if(c!==null) toast("코드가 맞지 않습니다"); return; }
    unlocked=true;
  }
  showTab(false);
};
$("btnSheet").onclick=()=>window.open(SHEET_URL,"_blank");
let statRows=[], statTotal=0, sortBy="score";
function drawStats(){
  const rows=statRows.slice().sort((a,b)=>
    sortBy==="score" ? (b.s-a.s||b.all-a.all||a.n.localeCompare(b.n,"ko"))
  : sortBy==="all"   ? (b.all-a.all||b.s-a.s||a.n.localeCompare(b.n,"ko"))
  :                    (b.c1-a.c1||b.s-a.s||a.n.localeCompare(b.n,"ko")));
  $("resultBox").innerHTML=
    `<table><thead><tr><th>순위</th><th>프로그램</th><th>점수</th><th>총 선택</th><th>1지망</th><th>2지망</th><th>3지망</th></tr></thead><tbody>`+
    rows.map((x,i)=>`<tr class="${i<9?"top9":""}"><td class="num">${i+1}</td><td>${x.n}</td>
      <td class="num">${x.s}</td><td class="num"><b>${x.all}</b></td>
      <td class="num">${x.c1}</td><td class="num">${x.c2}</td><td class="num">${x.c3}</td></tr>`).join("")+
    `</tbody></table>`;
  ["sortScore","sortAll","sortFirst"].forEach(id=>$(id).setAttribute("aria-pressed",
    id===(sortBy==="score"?"sortScore":sortBy==="all"?"sortAll":"sortFirst")));
  $("resultNote").textContent=`총 ${statTotal}명 제출. 점수는 1지망 3점·2지망 2점·3지망 1점, 총 선택은 지망과 상관없이 고른 사람 수입니다. 위쪽 9줄이 파란색입니다.`;
}
["sortScore","sortAll","sortFirst"].forEach(id=>$(id).onclick=()=>{
  sortBy = id==="sortScore"?"score":id==="sortAll"?"all":"first";
  if(statRows.length) drawStats();
});
$("btnLoad").onclick=async()=>{
  $("resultNote").textContent="불러오는 중…";
  try{
    const r=await fetch(api("action=stats")); const j=await r.json();
    statRows=j.rows.map(x=>({...x, all:x.c1+x.c2+x.c3})); statTotal=j.total;
    drawStats();
  }catch(e){ $("resultNote").textContent="결과를 불러오지 못했습니다. 웹앱 주소를 확인해 주세요."; }
};

renderAll();
</script>
</body>
</html>
